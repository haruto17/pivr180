[project]
name = "pivr180-device"
version = "0.1.0"
description = "pivr180 device software for Raspberry Pi 5"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.7",
    "pillow>=13.0.0",
    "pyserial>=3.5",
    "pyusb>=1.3.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
pivr180-capture = "pivr180_device.app:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "jsonschema>=4.23",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
