[package]
name = "editor"
version = "0.1.0"
description = "pivr180 editor"
authors = ["haruto17"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.23"
rayon = "1"
axum = "0.8.9"
axum-server = { version = "0.9.2", default-features = false, features = ["tls-rustls-ring"] }
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
hostname = "0.4.2"
tokio = { version = "1.54.1", features = ["fs", "rt"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3"
tokio = { version = "1.54.1", features = ["macros"] }
tower = { version = "0.5.3", features = ["util"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Not the dev default opt-level 0: a 12MP thumbnail then takes ~2s to decode instead of ~80ms.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3
